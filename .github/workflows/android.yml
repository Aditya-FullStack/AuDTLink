name: android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install minimodem
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends minimodem
          minimodem --version

      - name: Protocol and interop tests
        run: |
          python3 -m pip install --quiet numpy
          python3 tools/tests/test_airlink.py
          python3 tools/tests/test_kotlin_port.py
          python3 tools/tests/test_minimodem_interop.py

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Assemble debug APK
        working-directory: android
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Report artifact
        if: always()
        run: ls -lh android/app/build/outputs/apk/debug/ || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: airlink-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      # The in-app update check reads /releases/latest, so every push to main
      # republishes the release for the current versionName.
      - name: Publish GitHub release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION=$(grep -oP 'versionName = "\K[^"]+' android/app/build.gradle.kts)
          TAG="v${VERSION}"
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          NOTES="AuDTLink ${VERSION}, built from ${GITHUB_SHA:0:7}."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" --title "AuDTLink $TAG" --notes "$NOTES" --latest
          fi
          gh release view "$TAG" --json tagName,assets --jq '.tagName, (.assets[].name)'
